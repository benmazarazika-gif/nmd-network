 
name: Build NMD Network APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "nmd-network.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build NMD Network Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        run: |
          set -e
          test -f nmd-network.zip
          echo "NMD Network ZIP found."
          ls -lh nmd-network.zip

      - name: Extract project
        run: |
          set -e

          mkdir -p extracted-project
          unzip -q nmd-network.zip -d extracted-project

          PROJECT_SETTINGS=$(find extracted-project \
            -name settings.gradle.kts \
            -type f -print -quit)

          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate temporary Debug Keystore
        run: |
          set -e

          KEYSTORE="$PROJECT_DIR/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          test -f "$KEYSTORE"
          echo "Temporary Debug Keystore created successfully."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check project files
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/debug.keystore"

          echo "Project configuration verified."

      - name: Build NMD Network APK
        run: |
          set -e

          gradle \
            -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify generated APK
        run: |
          set -e

          APK_PATH=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      - name: Upload NMD Network APK
        uses: actions/upload-artifact@v4
        with:
          name: NMD-Network-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
